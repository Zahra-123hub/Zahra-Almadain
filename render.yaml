services:
  - type: web
    name: zahra-123hub-almadain-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GITHUB_OWNER
        value: Zahra-123hub
      - key: GITHUB_REPO
        value: Zahra-Almadain
      - key: ALLOWED_ORIGINS
        value: https://zahra-123hub.github.io,http://127.0.0.1:8000,http://localhost:8000
      - key: ADMIN_USERNAME
        value: admin
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Optional: automatic e-mail with the one-time registration link.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PORTAL_BASE_URL
        value: https://zahra-123hub.github.io/Zahra-Almadain
